<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <style>
    /*
      Geist — шрифт Vercel, тот же, что в витрине shadcn/ui. Лежит внутри
      расширения: CSP страниц расширения запрещает внешние источники, через
      CDN его не подключить. Файлы вариативные, поэтому одного хватает на все
      начертания (400/500/600). Лицензия SIL OFL 1.1 — fonts/LICENSE.txt.
    */
    @font-face {
      font-family: "Geist";
      src: url("fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Geist Mono";
      src: url("fonts/GeistMono-Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /*
      Токены и масштаб радиусов — прямой перенос значений из :root/.dark
      шаблона shadcn/ui (тема neutral, oklch переведён в ближайший hex,
      т.к. WebView расширений не везде поддерживает oklch()).
      Источники: apps/v4/app/globals.css и ui/switch.tsx, ui/input.tsx,
      ui/label.tsx, ui/card.tsx из shadcn-ui/ui на GitHub.

      Высота: попап в Firefox и Chrome обрезается на 600px и дальше даёт
      скролл. Всё, что ниже, рассчитано примерно на 540px — запас нужен,
      потому что превью пути при длинной подпапке переносится на 2-3 строки.
    */
    :root {
      --radius: 0.625rem;
      --radius-sm: calc(var(--radius) * 0.6);
      --radius-md: calc(var(--radius) * 0.8);
      --radius-xl: calc(var(--radius) * 1.4);

      --background: #0a0a0a;        /* oklch(0.145 0 0) */
      --foreground: #fafafa;        /* oklch(0.985 0 0) */
      --card: #171717;              /* oklch(0.205 0 0) — на ступень светлее фона */
      --primary: #e5e5e5;           /* oklch(0.922 0 0) — трек включённого свитча */
      --primary-foreground: #171717;/* oklch(0.205 0 0) — бегунок на включённом треке */
      --muted-foreground: #a3a3a3;  /* oklch(0.708 0 0) */
      --border: rgba(255, 255, 255, 0.1);  /* oklch(1 0 0 / 10%) */
      --input: rgba(255, 255, 255, 0.15);  /* oklch(1 0 0 / 15%) */
      --ring: #737373;              /* oklch(0.556 0 0) */

      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      padding: 12px 12px 0;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    /* Общая оболочка для шапки и секций: Card из shadcn —
       bg-card + border + shadow-sm + rounded-xl. */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      margin-bottom: 10px;
    }

    /* --- Заголовок страницы: типографика CardTitle + CardDescription
           из shadcn (leading-none font-semibold / text-sm muted). --- */
    .page-header {
      padding: 4px 4px 14px;
    }

    .page-header h1 {
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.01em;
      margin: 0 0 7px;
    }

    .page-header p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted-foreground);
    }

    /* --- Секции настроек --- */
    .section {
      padding: 14px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
      margin-bottom: 10px;
    }

    /* Label: text-sm font-medium, обычный текст переднего плана —
       не приглушённый, как было в исходной вёрстке. */
    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      color: var(--foreground);
      margin-bottom: 7px;
    }

    /* Input: почти прозрачная заливка (dark:bg-input/30 в оригинале),
       а не сплошная card-заливка. */
    input[type="text"] {
      width: 100%;
      height: 34px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--input);
      border-radius: var(--radius-md);
      color: var(--foreground);
      padding: 0 11px;
      font-size: 13px;
      font-family: var(--font-mono);
      outline: none;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]::placeholder {
      color: var(--muted-foreground);
    }

    input[type="text"]:focus-visible {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(115, 115, 115, 0.5);
    }

    /* --- Превью итогового пути --- */
    .preview {
      margin-top: 7px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.45;
      color: var(--muted-foreground);
      opacity: 0.75;
      word-break: break-all;
    }

    .preview .sep {
      color: #4a4a4a;
    }

    .preview .leaf {
      color: var(--muted-foreground);
      opacity: 1;
    }

    /* --- Строка с тумблером --- */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 11px;
    }

    .row-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground);
      line-height: 1.3;
    }

    /* Switch: геометрия по ui/switch.tsx — трек w-8 (32px), бегунок size-4
       (16px), сдвиг translate-x-[calc(100%-2px)] = 14px. Бегунок именно
       флекс-элемент, а не абсолютный: при абсолютном позиционировании отступ
       в 1px складывался с рамкой трека и кругляш вылезал за правый край.
       Высота трека 18px, а не 1.15rem (18.4px) из оригинала: при дробной
       высоте контентная коробка получалась 16.4px против 16px бегунка, и
       браузер округлял этот люфт по-разному в зависимости от вертикальной
       позиции — одинаковые свитчи выглядели по-разному. На 18px коробка
       ровно 16px, люфта нет. */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      cursor: pointer;
    }

    .switch .slider {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.12); /* dark:data-[state=unchecked]:bg-input/80 */
      border: 1px solid transparent;
      border-radius: 9999px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      pointer-events: none;
    }

    .switch .slider::before {
      content: "";
      flex: none;
      width: 16px;
      height: 16px;
      background: var(--foreground); /* dark:data-[state=unchecked]:bg-foreground */
      border-radius: 50%;
      transform: translateX(0);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .switch input:checked + .slider {
      background: var(--primary); /* data-[state=checked]:bg-primary */
    }

    .switch input:checked + .slider::before {
      background: var(--primary-foreground); /* dark:data-[state=checked]:bg-primary-foreground */
      transform: translateX(14px); /* translate-x-[calc(100%-2px)] для бегунка 16px */
    }

    .switch input:focus-visible + .slider {
      border-color: var(--ring); /* focus-visible:border-ring */
      box-shadow: 0 0 0 3px rgba(115, 115, 115, 0.5); /* focus-visible:ring-[3px] ring-ring/50 */
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 12px;
      font-size: 11.5px;
      color: var(--muted-foreground);
    }

    .footer .heart {
      color: #e5484d;
    }

    .footer .version {
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Waifu &amp; Meme Downloader</h1>
    <p>Download settings</p>
  </div>

  <div class="card section">
    <div class="section-title">Video &amp; GIF</div>
    <label class="field-label" for="videoSubfolder">Subfolder inside Downloads</label>
    <input type="text" id="videoSubfolder" placeholder="TwitterVideos" />
    <div class="preview" id="videoPreview"></div>
    <div class="row">
      <span class="row-label">Convert GIFs to real .gif</span>
      <label class="switch">
        <input type="checkbox" id="gifConvert" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="row-label">Ask every time</span>
      <label class="switch">
        <input type="checkbox" id="videoAlwaysAsk" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card section">
    <div class="section-title">Images</div>
    <label class="field-label" for="photoSubfolder">Subfolder</label>
    <input type="text" id="photoSubfolder" placeholder="TwitterImages" />
    <div class="preview" id="photoPreview"></div>
    <div class="row">
      <span class="row-label">Sort into folders by author</span>
      <label class="switch">
        <input type="checkbox" id="photoByAuthor" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="row-label">Ask every time</span>
      <label class="switch">
        <input type="checkbox" id="photoAlwaysAsk" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span>Made with <span class="heart">♥</span></span>
    <span class="version" id="version"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
